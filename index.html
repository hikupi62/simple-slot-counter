<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <title>&#x30B7;&#x30F3;&#x30D7;&#x30EB;&#x30B9;&#x30ED;&#x30C3;&#x30C8;&#x30AB;&#x30A6;&#x30F3;&#x30BF;&#x30FC;</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell" id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">SIMPLE SLOT COUNTER</p>
        <h1>&#x30B9;&#x30ED;&#x30C3;&#x30C8;&#x30AB;&#x30A6;&#x30F3;&#x30BF;&#x30FC;</h1>
      </div>
      <button class="minus-toggle" id="minusToggle" type="button" aria-pressed="false">-</button>
    </header>

    <section class="mode-banner" id="modeBanner" aria-live="polite" hidden>
      &#x6E1B;&#x7B97;&#x30E2;&#x30FC;&#x30C9;&#x4E2D;
    </section>

    <section class="game-panel">
      <p class="panel-label">&#x30B2;&#x30FC;&#x30E0;&#x6570;</p>
      <div class="lcd-display" id="gameDisplay">0</div>
      <button class="game-button" id="gameButton" type="button">GAME</button>
    </section>

    <section class="counter-grid" aria-label="&#x5C0F;&#x5F79;&#x30AB;&#x30A6;&#x30F3;&#x30BF;&#x30FC;">
      <article class="counter-card counter-a">
        <div class="counter-head">
          <h2>&#x5C0F;&#x5F79;A</h2>
          <div class="counter-value" id="count-a">0</div>
        </div>
        <div class="counter-prob" id="prob-a">1/--</div>
        <button class="counter-button" data-key="a" type="button">&#x5C0F;&#x5F79;A</button>
      </article>

      <article class="counter-card counter-b">
        <div class="counter-head">
          <h2>&#x5C0F;&#x5F79;B</h2>
          <div class="counter-value" id="count-b">0</div>
        </div>
        <div class="counter-prob" id="prob-b">1/--</div>
        <button class="counter-button" data-key="b" type="button">&#x5C0F;&#x5F79;B</button>
      </article>

      <article class="counter-card counter-c">
        <div class="counter-head">
          <h2>&#x5C0F;&#x5F79;C</h2>
          <div class="counter-value" id="count-c">0</div>
        </div>
        <div class="counter-prob" id="prob-c">1/--</div>
        <button class="counter-button" data-key="c" type="button">&#x5C0F;&#x5F79;C</button>
      </article>

      <article class="counter-card counter-d">
        <div class="counter-head">
          <h2>&#x5C0F;&#x5F79;D</h2>
          <div class="counter-value" id="count-d">0</div>
        </div>
        <div class="counter-prob" id="prob-d">1/--</div>
        <button class="counter-button" data-key="d" type="button">&#x5C0F;&#x5F79;D</button>
      </article>

      <article class="counter-card counter-e">
        <div class="counter-head">
          <h2>&#x5C0F;&#x5F79;E</h2>
          <div class="counter-value" id="count-e">0</div>
        </div>
        <div class="counter-prob" id="prob-e">1/--</div>
        <button class="counter-button" data-key="e" type="button">&#x5C0F;&#x5F79;E</button>
      </article>
    </section>

    <footer class="footer-actions">
      <button class="reset-button" id="resetButton" type="button">&#x30EA;&#x30BB;&#x30C3;&#x30C8;</button>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
